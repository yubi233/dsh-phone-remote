<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0f1115" />
    <title>dsh remote</title>
    <link rel="manifest" href="./dist/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./dist/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="dsh remote" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%234f8cff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./dist/main.css" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>This page needs JavaScript.</noscript>
    <script>
      window.setTimeout(function () {
        if (!document.documentElement.hasAttribute('data-dsh-remote-booted')) {
          var root = document.getElementById('root')
          if (root && root.childElementCount === 0) {
            root.textContent =
              'The bundled entry did not load. Run `pnpm --filter @dsh-web-remote/mobile-web build` and reload.'
          }
        }
      }, 1500)
    </script>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
